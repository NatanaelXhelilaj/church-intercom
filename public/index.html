<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Church Intercom — Audio Rooms</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .rooms { margin-bottom: 12px; }
    button { margin: 4px; }
    .session-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .local-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .peer-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    .peer-card { border: 1px solid #ccc; padding: 8px; border-radius: 6px; min-width: 180px; background: #f9f9f9; }
    .peer-card .header { font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .peer-card audio { width: 100%; }
    .peer-card .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .admin-badge { color: #b26; font-size: 0.85em; }
  </style>
</head>
<body>
  <h3>Church Intercom — 8 Audio Rooms (click to join)</h3>
  <div class="rooms" id="rooms"></div>
  <div class="session-controls">
    <label><input type="checkbox" id="adminMode" /> Join as admin</label>
    <button id="leave" disabled>Leave</button>
    <span id="status"></span>
  </div>

  <div id="locals">
    <h4>Local Microphone</h4>
    <div class="local-controls">
      <span id="micStatus">Disconnected</span>
      <button id="mute" disabled>Mute Mic</button>
      <button id="pushToTalk" disabled>Push to Talk</button>
    </div>
  </div>

  <div id="remotes">
    <h4>Participants</h4>
    <div id="remoteList" class="peer-list"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    // do not statically import Device here — a failed import would block the whole module.
    // We'll dynamically load it when actually joining a room.
    let Device = null;
    let deviceLoadPromise = null;

    async function loadDeviceModule() {
      if (Device) return Device;
      if (deviceLoadPromise) return deviceLoadPromise;

      const moduleSources = [
        '/vendor/mediasoup-client.js',
        '/vendor/mediasoup-client.mjs',
        'https://cdn.jsdelivr.net/npm/mediasoup-client@3.17.1/lib/index.mjs',
        'https://cdn.jsdelivr.net/npm/mediasoup-client@3.11.4/lib/index.mjs',
        'https://esm.sh/mediasoup-client@3.17.1?bundle',
      ];
      const scriptSources = [
        '/vendor/mediasoup-client.min.js',
        'https://cdn.jsdelivr.net/npm/mediasoup-client@3.17.1/lib/mediasoup-client.min.js',
        'https://unpkg.com/mediasoup-client@3.17.1/lib/mediasoup-client.min.js',
      ];

      const errors = [];

      async function tryModule(src) {
        try {
          const mod = await import(/* @vite-ignore */ src);
          const exported = mod?.Device || mod?.default?.Device || mod?.default;
          if (typeof exported !== 'function') throw new Error('Device export missing');
          Device = exported;
          return true;
        } catch (err) {
          console.warn(`Failed to load mediasoup-client module from ${src}`, err);
          errors.push({ src, err });
          return false;
        }
      }

      async function tryScript(src) {
        try {
          await new Promise((resolve, reject) => {
            const existing = document.querySelector(`script[data-mediasoup-src="${src}"]`);
            if (existing && existing.dataset.loaded === 'true') return resolve();
            if (existing && existing.dataset.loaded === 'error') {
              existing.remove();
            } else if (existing && existing.dataset.loaded === 'false') {
              existing.addEventListener('load', resolve, { once: true });
              existing.addEventListener('error', () => reject(new Error(`Failed loading script ${src}`)), { once: true });
              return;
            }
            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.async = true;
            script.dataset.mediasoupSrc = src;
            script.dataset.loaded = 'false';
            script.addEventListener('load', () => {
              script.dataset.loaded = 'true';
              resolve();
            });
            script.addEventListener('error', () => {
              script.dataset.loaded = 'error';
              reject(new Error(`Failed loading script ${src}`));
            });
            script.src = src;
            document.head.appendChild(script);
          });
          const candidate = window.mediasoupClient?.Device || window.mediasoupClient;
          if (typeof candidate !== 'function') throw new Error('window.mediasoupClient.Device missing');
          Device = candidate;
          return true;
        } catch (err) {
          console.warn(`Failed to load mediasoup-client script from ${src}`, err);
          errors.push({ src, err });
          return false;
        }
      }

      deviceLoadPromise = (async () => {
        for (const src of moduleSources) {
          if (await tryModule(src)) return Device;
        }
        for (const src of scriptSources) {
          if (await tryScript(src)) return Device;
        }
        const error = new Error('Unable to load mediasoup-client');
        error.details = errors.slice();
        throw error;
      })();

      try {
        return await deviceLoadPromise;
      } finally {
        if (!Device) deviceLoadPromise = null;
      }
    }

    const ROOMS = ['room1','room2','room3','room4','room5','room6','room7','room8'];
    const roomsDiv = document.getElementById('rooms');
    const statusEl = document.getElementById('status');
    const leaveBtn = document.getElementById('leave');
    const adminToggle = document.getElementById('adminMode');
    const muteBtn = document.getElementById('mute');
    const pushToTalkBtn = document.getElementById('pushToTalk');
    const micStatusEl = document.getElementById('micStatus');
    const remoteList = document.getElementById('remoteList');

    for (const r of ROOMS) {
      const btn = document.createElement('button');
      btn.textContent = `Join ${r}`;
      btn.onclick = () => joinRoom(r);
      roomsDiv.appendChild(btn);
    }

    let socket = null;
    let device = null;
    let sendTransport = null;
    let recvTransport = null;
    let localStream = null;
    let producedIds = [];
    const consuming = {};
    let micMuted = false;
    let pushToTalkActive = false;
    let isAdmin = false;
    let disconnectHandler = null;
    const peersInfo = new Map();
    const peerCards = new Map();
    const producerToPeer = new Map();

    function log(s) { console.log(s); statusEl.textContent = s; }

    leaveBtn.onclick = () => {
      cleanup(true);
    };

    muteBtn.addEventListener('click', () => {
      if (!localStream) return;
      setMicMuted(!micMuted);
    });

    function startPushToTalk() {
      if (!localStream) return;
      pushToTalkActive = true;
      applyLocalTrackState();
      updateMicStatus();
    }

    function stopPushToTalk() {
      if (!localStream) return;
      pushToTalkActive = false;
      applyLocalTrackState();
      updateMicStatus();
    }

    pushToTalkBtn.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      startPushToTalk();
    });
    pushToTalkBtn.addEventListener('mouseup', stopPushToTalk);
    pushToTalkBtn.addEventListener('mouseleave', stopPushToTalk);
    pushToTalkBtn.addEventListener('touchstart', (ev) => {
      ev.preventDefault();
      startPushToTalk();
    }, { passive: false });
    pushToTalkBtn.addEventListener('touchend', stopPushToTalk);
    pushToTalkBtn.addEventListener('touchcancel', stopPushToTalk);

    function applyLocalTrackState() {
      if (!localStream) return;
      const tracks = localStream.getAudioTracks();
      for (const track of tracks) {
        track.enabled = !micMuted || pushToTalkActive;
      }
    }

    function setMicMuted(muted) {
      micMuted = !!muted;
      applyLocalTrackState();
      muteBtn.textContent = micMuted ? 'Unmute Mic' : 'Mute Mic';
      updateMicStatus();
    }

    function updateMicStatus() {
      if (!localStream) {
        micStatusEl.textContent = 'Disconnected';
        return;
      }
      if (micMuted && pushToTalkActive) {
        micStatusEl.textContent = 'Push-to-talk (live)';
      } else if (micMuted) {
        micStatusEl.textContent = 'Muted';
      } else {
        micStatusEl.textContent = 'Live';
      }
    }

    function enableMicControls(enabled) {
      muteBtn.disabled = !enabled;
      pushToTalkBtn.disabled = !enabled;
    }

    async function joinRoom(room) {
      if (socket) {
        alert('Already connected. Leave first.');
        return;
      }
      log('Connecting to room ' + room);

      try {
        const DeviceClass = await loadDeviceModule();
        Device = DeviceClass;
      } catch (err) {
        console.error('Failed to load mediasoup-client:', err);
        alert('Failed to load mediasoup client. Check console for details.');
        return;
      }

      isAdmin = !!adminToggle.checked;
      adminToggle.disabled = true;

      const query = { room };
      if (isAdmin) query.admin = '1';
      socket = io({ query });

      disconnectHandler = () => {
        cleanup(false);
      };
      socket.on('disconnect', disconnectHandler);

      socket.on('connect_error', () => { log('connect_error'); });
      socket.on('error', (msg) => { alert('Server error: ' + msg); });
      socket.on('kicked', ({ by }) => {
        alert('You were kicked');
        cleanup(true);
      });

      socket.on('peers', (list) => {
        for (const peer of list || []) {
          peersInfo.set(peer.id, { admin: !!peer.admin });
          ensurePeerCard(peer.id);
        }
        refreshPeerCards();
      });

      socket.on('peer-joined', ({ id, admin }) => {
        peersInfo.set(id, { admin: !!admin });
        ensurePeerCard(id);
        log('peer-joined: ' + id);
        refreshPeerCards();
      });

      socket.on('peer-left', ({ id }) => {
        peersInfo.delete(id);
        removePeerCard(id);
        log('peer-left: ' + id);
        refreshPeerCards();
      });

      socket.on('new-producer', ({ producerId, socketId }) => {
        consumeProducer(producerId, room, socketId).catch(console.error);
      });

      socket.on('producer-closed', ({ producerId }) => {
        removeRemote(producerId);
      });

      socket.emit('joinRoom', { roomId: room }, () => {});

      const routerRtpCapabilities = await new Promise((resolve) => {
        socket.emit('getRtpCapabilities', (cap) => resolve(cap));
      });

      device = new Device();
      await device.load({ routerRtpCapabilities });

      try {
        const mediaConstraints = {
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        };
        localStream = await navigator.mediaDevices.getUserMedia(mediaConstraints);
        setMicMuted(false);
        enableMicControls(true);
      } catch (err) {
        alert('Microphone required');
        cleanup(true);
        return;
      }

      const sendParams = await new Promise((resolve) => {
        socket.emit('createTransport', { roomId: room }, (p) => resolve(p));
      });
      if (sendParams?.error) {
        alert('Transport error: ' + sendParams.error);
        cleanup(true);
        return;
      }
      sendTransport = device.createSendTransport(sendParams);
      sendTransport.on('connect', ({ dtlsParameters }, cb, errCb) => {
        socket.emit('connectTransport', { roomId: room, transportId: sendTransport.id, dtlsParameters }, (res) => {
          if (res && res.error) return errCb(res.error);
          cb();
        });
      });
      sendTransport.on('produce', ({ kind, rtpParameters }, cb, errCb) => {
        socket.emit('produce', { roomId: room, transportId: sendTransport.id, kind, rtpParameters }, (res) => {
          if (res && res.error) return errCb(res.error);
          producedIds.push(res.id);
          cb({ id: res.id });
        });
      });

      for (const track of localStream.getAudioTracks()) {
        try {
          const codecOptions = {
            opusStereo: true,
            opusDtx: true,
          };
          await sendTransport.produce({ track, codecOptions });
        } catch (e) {
          console.warn('produce error', e);
        }
      }
      applyLocalTrackState();

      const recvParams = await new Promise((resolve) => {
        socket.emit('createTransport', { roomId: room }, (p) => resolve(p));
      });
      if (recvParams?.error) {
        alert('Transport error: ' + recvParams.error);
        cleanup(true);
        return;
      }
      recvTransport = device.createRecvTransport(recvParams);
      recvTransport.on('connect', ({ dtlsParameters }, cb, errCb) => {
        socket.emit('connectTransport', { roomId: room, transportId: recvTransport.id, dtlsParameters }, (res) => {
          if (res && res.error) return errCb(res.error);
          cb();
        });
      });

      const existing = await new Promise((resolve) => {
        socket.emit('getProducers', { roomId: room }, (list) => resolve(list || []));
      });
      for (const p of existing) {
        consumeProducer(p.producerId, room, p.socketId).catch(console.error);
      }

      leaveBtn.disabled = false;
      log('Joined ' + room);
      refreshPeerCards();
      updateMicStatus();
    }

    async function consumeProducer(producerId, room, ownerId) {
      if (!recvTransport || !device || !socket) return;
      if (consuming[producerId]) return;

      const data = await new Promise((resolve) => {
        socket.emit('consume', { roomId: room, producerId, rtpCapabilities: device.rtpCapabilities, transportId: recvTransport.id }, (res) => resolve(res));
      });
      if (!data || data.error) {
        console.warn('consume error', data?.error);
        return;
      }

      const consumer = await recvTransport.consume({
        id: data.id,
        producerId: data.producerId,
        kind: data.kind,
        rtpParameters: data.rtpParameters,
      });

      consuming[producerId] = consumer;
      if (ownerId) producerToPeer.set(producerId, ownerId);

      const stream = new MediaStream();
      stream.addTrack(consumer.track);

      let record = null;
      if (ownerId) {
        record = ensurePeerCard(ownerId);
      }
      if (!record && producerToPeer.has(producerId)) {
        record = peerCards.get(producerToPeer.get(producerId));
      }
      if (record) {
        record.audio.srcObject = stream;
        record.stream = stream;
        if (record.muted && !record.pushHeld) {
          record.audio.muted = true;
        } else {
          record.audio.muted = false;
        }
        record.audio.play().catch(() => {});
      }

      consumer.on('producerclose', () => {
        removeRemote(producerId);
      });
      consumer.on('transportclose', () => {
        removeRemote(producerId);
      });
    }

    function removeRemote(producerId) {
      const consumer = consuming[producerId];
      if (consumer) {
        try { consumer.close(); } catch (e) {}
        delete consuming[producerId];
      }
      const peerId = producerToPeer.get(producerId);
      if (peerId) {
        producerToPeer.delete(producerId);
        const record = peerCards.get(peerId);
        if (record) {
          if (record.stream) {
            try { record.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
            record.stream = null;
          }
          if (record.audio) {
            record.audio.srcObject = null;
          }
        }
      }
    }

    function createPeerCard(peerId) {
      const card = document.createElement('div');
      card.className = 'peer-card';
      card.dataset.peerId = peerId;

      const header = document.createElement('div');
      header.className = 'header';
      const name = document.createElement('span');
      name.textContent = peerId;
      const badge = document.createElement('span');
      badge.className = 'admin-badge';
      header.appendChild(name);
      header.appendChild(badge);
      card.appendChild(header);

      const audio = document.createElement('audio');
      audio.autoplay = true;
      audio.controls = false;
      audio.playsInline = true;
      card.appendChild(audio);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const muteButton = document.createElement('button');
      muteButton.textContent = 'Mute';
      actions.appendChild(muteButton);

      const pushButton = document.createElement('button');
      pushButton.textContent = 'Push to Talk';
      actions.appendChild(pushButton);

      card.appendChild(actions);

      const record = {
        peerId,
        card,
        nameEl: name,
        adminBadge: badge,
        audio,
        actions,
        muteButton,
        pushButton,
        kickBtn: null,
        muted: false,
        pushHeld: false,
        stream: null,
        setMuted: null,
      };

      function setMuted(state) {
        record.muted = state;
        if (!record.pushHeld) {
          audio.muted = state;
        }
        muteButton.textContent = state ? 'Unmute' : 'Mute';
      }

      function pushStart(ev) {
        if (ev) ev.preventDefault();
        record.pushHeld = true;
        audio.muted = false;
      }

      function pushEnd() {
        record.pushHeld = false;
        if (record.muted) {
          audio.muted = true;
        }
      }

      muteButton.addEventListener('click', () => {
        setMuted(!record.muted);
      });

      pushButton.addEventListener('mousedown', pushStart);
      pushButton.addEventListener('mouseup', pushEnd);
      pushButton.addEventListener('mouseleave', pushEnd);
      pushButton.addEventListener('touchstart', (ev) => {
        pushStart(ev);
      }, { passive: false });
      pushButton.addEventListener('touchend', () => pushEnd());
      pushButton.addEventListener('touchcancel', () => pushEnd());

      record.setMuted = setMuted;

      return record;
    }

    function ensurePeerCard(peerId) {
      if (!peerId || peerId === socket?.id) return null;
      let record = peerCards.get(peerId);
      if (!record) {
        record = createPeerCard(peerId);
        peerCards.set(peerId, record);
        remoteList.appendChild(record.card);
      }
      const meta = peersInfo.get(peerId);
      record.adminBadge.textContent = meta?.admin ? 'admin' : '';
      updateKickButton(record);
      return record;
    }

    function updateKickButton(record) {
      if (!record) return;
      if (!isAdmin) {
        if (record.kickBtn) {
          record.kickBtn.remove();
          record.kickBtn = null;
        }
        return;
      }
      if (record.kickBtn) return;
      const btn = document.createElement('button');
      btn.textContent = 'Kick';
      btn.addEventListener('click', () => {
        if (!socket) return;
        socket.emit('kick', { targetId: record.peerId });
      });
      record.actions.appendChild(btn);
      record.kickBtn = btn;
    }

    function refreshPeerCards() {
      for (const record of peerCards.values()) {
        const meta = peersInfo.get(record.peerId);
        record.adminBadge.textContent = meta?.admin ? 'admin' : '';
        if (record.muted && !record.pushHeld) {
          record.audio.muted = true;
        }
        if (!record.muted) {
          record.audio.muted = false;
        }
        if (isAdmin) {
          updateKickButton(record);
        } else if (record.kickBtn) {
          record.kickBtn.remove();
          record.kickBtn = null;
        }
      }
    }

    function removePeerCard(peerId) {
      const record = peerCards.get(peerId);
      if (!record) return;
      if (record.stream) {
        try { record.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
      }
      if (record.audio) {
        record.audio.srcObject = null;
      }
      if (record.card.parentElement) {
        record.card.parentElement.removeChild(record.card);
      }
      peerCards.delete(peerId);

      for (const [producerId, ownerId] of Array.from(producerToPeer.entries())) {
        if (ownerId === peerId) {
          producerToPeer.delete(producerId);
          const consumer = consuming[producerId];
          if (consumer) {
            try { consumer.close(); } catch (e) {}
            delete consuming[producerId];
          }
        }
      }
    }

    function cleanup(forceDisconnect = false) {
      const currentSocket = socket;
      if (currentSocket) {
        if (disconnectHandler) {
          currentSocket.off('disconnect', disconnectHandler);
        }
        if (forceDisconnect) {
          try { currentSocket.disconnect(); } catch (e) {}
        }
      }
      socket = null;
      disconnectHandler = null;

      if (sendTransport) {
        try { sendTransport.close(); } catch (e) {}
      }
      if (recvTransport) {
        try { recvTransport.close(); } catch (e) {}
      }
      sendTransport = null;
      recvTransport = null;

      for (const consumer of Object.values(consuming)) {
        try { consumer.close(); } catch (e) {}
      }
      for (const key of Object.keys(consuming)) {
        delete consuming[key];
      }

      for (const record of peerCards.values()) {
        if (record.stream) {
          try { record.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
        }
        if (record.audio) {
          record.audio.srcObject = null;
        }
        record.card.remove();
      }
      peerCards.clear();
      peersInfo.clear();
      producerToPeer.clear();
      remoteList.innerHTML = '';

      if (localStream) {
        for (const track of localStream.getTracks()) {
          try { track.stop(); } catch (e) {}
        }
        localStream = null;
      }

      producedIds = [];
      micMuted = false;
      pushToTalkActive = false;
      isAdmin = false;
      enableMicControls(false);
      muteBtn.textContent = 'Mute Mic';
      updateMicStatus();

      device = null;

      leaveBtn.disabled = true;
      adminToggle.disabled = false;

      log('Left');
    }
  </script>
</body>
</html>
