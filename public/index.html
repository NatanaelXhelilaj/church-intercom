<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Church Intercom — Audio Rooms</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --border: rgba(15, 23, 42, 0.12);
      --border-strong: rgba(15, 23, 42, 0.2);
      --text: #0f172a;
      --muted: rgba(15, 23, 42, 0.6);
      --primary: #4059ff;
      --primary-dark: #2433b8;
      --primary-soft: rgba(64, 89, 255, 0.1);
      --danger: #c2410c;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #f3f4ff 0%, #eef2ff 35%, #f8fafc 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 16px 48px;
    }

    .app-shell {
      width: min(960px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-header {
      text-align: center;
    }

    .app-header h1 {
      margin: 0 0 6px;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      letter-spacing: -0.02em;
    }

    .app-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px clamp(16px, 3vw, 28px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
    }

    .panel-header .subtle,
    .subtle {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .join-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: var(--surface-strong);
    }

    input[type="text"]:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    #rooms {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    #rooms button {
      width: 100%;
      padding: 14px 20px;
      text-align: center;
      box-shadow: 0 12px 24px rgba(64, 89, 255, 0.12);
    }

    #rooms button:hover:not(:disabled),
    #rooms button:focus-visible:not(:disabled) {
      box-shadow: 0 16px 32px rgba(64, 89, 255, 0.2);
    }

    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }

    button:hover:not(:disabled),
    button:focus-visible:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(64, 89, 255, 0.24);
      outline: none;
      background: var(--primary-dark);
    }

    button:disabled {
      cursor: not-allowed;
      background: rgba(15, 23, 42, 0.15);
      color: rgba(15, 23, 42, 0.45);
      box-shadow: none;
    }

    .secondary {
      background: rgba(15, 23, 42, 0.08);
      color: var(--text);
    }

    .secondary:hover:not(:disabled),
    .secondary:focus-visible:not(:disabled) {
      background: rgba(15, 23, 42, 0.16);
      box-shadow: none;
    }

    .session-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .session-controls .status {
      min-height: 1.2em;
      color: var(--muted);
      font-size: 0.85rem;
      flex: 1;
      text-align: right;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--text);
    }

    .toggle input {
      width: 18px;
      height: 18px;
    }

    .local-controls,
    .peer-card .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .mic-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .mic-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .status-chip.live {
      background: rgba(34, 197, 94, 0.18);
      color: #166534;
    }

    .status-chip.muted {
      background: rgba(234, 179, 8, 0.18);
      color: #92400e;
    }

    .status-chip.ptt {
      background: rgba(14, 165, 233, 0.18);
      color: #0f609b;
    }

    .status-chip.offline {
      background: rgba(15, 23, 42, 0.08);
      color: var(--muted);
    }

    .peer-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .peer-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      background: var(--surface-strong);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .peer-card .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .name-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .peer-name {
      font-weight: 600;
      font-size: 1rem;
      word-break: break-word;
    }

    .peer-id {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .admin-badge {
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .peer-card audio {
      width: 100%;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.05);
    }

    .peer-card .actions button {
      flex: 1;
    }

    .kick {
      background: rgba(194, 65, 12, 0.12);
      color: var(--danger);
    }

    .kick:hover:not(:disabled),
    .kick:focus-visible:not(:disabled) {
      background: rgba(194, 65, 12, 0.2);
      box-shadow: none;
    }

    @media (max-width: 720px) {
      body {
        padding: 24px 12px 36px;
      }

      .session-controls {
        flex-direction: column;
        align-items: stretch;
      }

      .session-controls button,
      .peer-card .actions button {
        width: 100%;
      }

      .session-controls .status {
        width: 100%;
        text-align: left;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: rgba(15, 23, 42, 0.6);
        --surface-strong: rgba(15, 23, 42, 0.75);
        --border: rgba(148, 163, 184, 0.25);
        --border-strong: rgba(148, 163, 184, 0.45);
        --text: #e2e8f0;
        --muted: rgba(226, 232, 240, 0.7);
      }

      body {
        background: radial-gradient(circle at top, rgba(30, 64, 175, 0.35), rgba(15, 23, 42, 0.95));
      }

      button:disabled {
        background: rgba(226, 232, 240, 0.1);
        color: rgba(226, 232, 240, 0.5);
      }

      .secondary {
        background: rgba(226, 232, 240, 0.12);
        color: var(--text);
      }

      .secondary:hover:not(:disabled),
      .secondary:focus-visible:not(:disabled) {
        background: rgba(226, 232, 240, 0.18);
      }

      .status-chip {
        background: rgba(226, 232, 240, 0.12);
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Church Intercom</h1>
      <p>Join an audio room to coordinate from any device.</p>
    </header>

    <section class="panel join-panel">
      <div class="panel-header">
        <h2>Join a room</h2>
        <span class="subtle">Enter your name, pick a room, and hop in.</span>
      </div>
      <div class="field-group">
        <label class="field-label" for="displayName">Display name</label>
        <input
          type="text"
          id="displayName"
          maxlength="40"
          autocomplete="name"
          autocapitalize="words"
          spellcheck="false"
          placeholder="e.g. Sarah Johnson"
        />
      </div>
      <div id="rooms" aria-label="Available rooms"></div>
      <div class="session-controls">
        <label class="toggle"><input type="checkbox" id="adminMode" /> Join as admin</label>
        <button id="leave" class="secondary" disabled>Leave room</button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
    </section>

    <section id="locals" class="panel mic-panel">
      <div class="panel-header">
        <h2>Local Microphone</h2>
        <span id="localName" class="subtle">Name not set</span>
      </div>
      <div class="mic-status">
        <span id="micStatus" class="status-chip offline">Disconnected</span>
      </div>
      <div class="local-controls">
        <button id="mute" disabled>Mute Mic</button>
        <button id="pushToTalk" disabled>Push to Talk</button>
      </div>
    </section>

    <section id="remotes" class="panel participants-panel">
      <div class="panel-header">
        <h2>Participants</h2>
        <span class="subtle">Everyone else in your room will appear here.</span>
      </div>
      <div id="remoteList" class="peer-list" role="list"></div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    // do not statically import Device here — a failed import would block the whole module.
    // We'll dynamically load it when actually joining a room.
    let Device = null;
    let deviceLoadPromise = null;

    // Helper: load mediasoup-client Device, trying local vendor copies first and
    // falling back to a CDN copy. We attempt both native ES module endpoints and
    // UMD bundles so the app can recover even if only the minified browser build
    // is available.
    async function loadDeviceModule() {
      if (Device) return Device;
      if (deviceLoadPromise) return deviceLoadPromise;

      const moduleSources = [
        '/vendor/mediasoup-client.js',
        '/vendor/mediasoup-client.mjs',
        'https://cdn.jsdelivr.net/npm/mediasoup-client@3.17.1/lib/index.mjs',
        'https://cdn.jsdelivr.net/npm/mediasoup-client@3.11.4/lib/index.mjs',
        'https://esm.sh/mediasoup-client@3.17.1?bundle',
      ];
      const scriptSources = [
        '/vendor/mediasoup-client.min.js',
        'https://cdn.jsdelivr.net/npm/mediasoup-client@3.17.1/lib/mediasoup-client.min.js',
        'https://unpkg.com/mediasoup-client@3.17.1/lib/mediasoup-client.min.js',
      ];

      const errors = [];

      async function tryModule(src) {
        try {
          const mod = await import(/* @vite-ignore */ src);
          const exported = mod?.Device || mod?.default?.Device || mod?.default;
          if (typeof exported !== 'function') throw new Error('Device export missing');
          Device = exported;
          return true;
        } catch (err) {
          console.warn(`Failed to load mediasoup-client module from ${src}`, err);
          errors.push({ src, err });
          return false;
        }
      }

      async function tryScript(src) {
        try {
          await new Promise((resolve, reject) => {
            const existing = document.querySelector(`script[data-mediasoup-src="${src}"]`);
            if (existing && existing.dataset.loaded === 'true') return resolve();
            if (existing && existing.dataset.loaded === 'error') {
              existing.remove();
            } else if (existing && existing.dataset.loaded === 'false') {
              existing.addEventListener('load', resolve, { once: true });
              existing.addEventListener('error', () => reject(new Error(`Failed loading script ${src}`)), { once: true });
              return;
            }
            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.async = true;
            script.dataset.mediasoupSrc = src;
            script.dataset.loaded = 'false';
            script.addEventListener('load', () => {
              script.dataset.loaded = 'true';
              resolve();
            });
            script.addEventListener('error', () => {
              script.dataset.loaded = 'error';
              reject(new Error(`Failed loading script ${src}`));
            });
            script.src = src;
            document.head.appendChild(script);
          });
          const candidate = window.mediasoupClient?.Device || window.mediasoupClient;
          if (typeof candidate !== 'function') throw new Error('window.mediasoupClient.Device missing');
          Device = candidate;
          return true;
        } catch (err) {
          console.warn(`Failed to load mediasoup-client script from ${src}`, err);
          errors.push({ src, err });
          return false;
        }
      }

      deviceLoadPromise = (async () => {
        for (const src of moduleSources) {
          if (await tryModule(src)) return Device;
        }
        for (const src of scriptSources) {
          if (await tryScript(src)) return Device;
        }
        const error = new Error('Unable to load mediasoup-client');
        error.details = errors.slice();
        throw error;
      })();

      try {
        return await deviceLoadPromise;
      } finally {
        if (!Device) deviceLoadPromise = null;
      }
    }

    const ROOMS = ['room1','room2','room3','room4','room5','room6','room7','room8'];
    const roomsDiv = document.getElementById('rooms');
    const statusEl = document.getElementById('status');
    const leaveBtn = document.getElementById('leave');
    const adminToggle = document.getElementById('adminMode');
    const muteBtn = document.getElementById('mute');
    const pushToTalkBtn = document.getElementById('pushToTalk');
    const micStatusEl = document.getElementById('micStatus');
    const remoteList = document.getElementById('remoteList');
    const nameInput = document.getElementById('displayName');
    const localNameEl = document.getElementById('localName');

    for (const r of ROOMS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      const prettyRoom = r.replace(/room(\d+)/i, 'Room $1');
      btn.textContent = `Join ${prettyRoom}`;
      btn.setAttribute('aria-label', `Join ${prettyRoom}`);
      btn.onclick = () => joinRoom(r);
      roomsDiv.appendChild(btn);
    }

    let socket = null;
    let device = null;
    let sendTransport = null;
    let recvTransport = null;
    let localStream = null;
    let producedIds = [];
    const consuming = {};
    let micMuted = false;
    let pushToTalkActive = false;
    let headsetPressActive = false;
    let isAdmin = false;
    let displayName = '';
    let joiningRoom = false;
    let disconnectHandler = null;
    const peersInfo = new Map();
    const peerCards = new Map();
    const producerToPeer = new Map();

    function summarizeId(id) {
      if (!id) return '';
      const str = String(id);
      if (str.length <= 12) return `ID • ${str}`;
      return `ID • ${str.slice(0, 4)}…${str.slice(-4)}`;
    }

    function peerDisplayName(peerId, name) {
      if (typeof name === 'string' && name.trim()) {
        return name.trim();
      }
      if (!peerId) return 'Participant';
      const tail = String(peerId).slice(-4);
      return `Guest ${tail}`;
    }

    function log(s) { console.log(s); statusEl.textContent = s; }

    function setRoomButtonsDisabled(state) {
      for (const btn of roomsDiv.querySelectorAll('button')) {
        btn.disabled = state;
      }
    }

    leaveBtn.onclick = () => {
      cleanup(true);
    };

    muteBtn.addEventListener('click', () => {
      if (!localStream) return;
      setMicMuted(!micMuted);
    });

    function startPushToTalk() {
      if (!localStream) return;
      pushToTalkActive = true;
      applyLocalTrackState();
      updateMicStatus();
    }

    function stopPushToTalk() {
      if (!localStream) return;
      pushToTalkActive = false;
      applyLocalTrackState();
      updateMicStatus();
    }

    pushToTalkBtn.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      startPushToTalk();
    });
    pushToTalkBtn.addEventListener('mouseup', stopPushToTalk);
    pushToTalkBtn.addEventListener('mouseleave', stopPushToTalk);
    pushToTalkBtn.addEventListener('touchstart', (ev) => {
      ev.preventDefault();
      startPushToTalk();
    }, { passive: false });
    pushToTalkBtn.addEventListener('touchend', stopPushToTalk);
    pushToTalkBtn.addEventListener('touchcancel', stopPushToTalk);

    const HEADSET_KEY_CODES = new Set(['HeadsetHook', 'MediaPlayPause']);

    function isHeadsetButtonEvent(ev) {
      if (!ev) return false;
      if (HEADSET_KEY_CODES.has(ev.code) || HEADSET_KEY_CODES.has(ev.key)) return true;
      if (typeof ev.keyCode === 'number' && ev.keyCode === 179) return true;
      return false;
    }

    function headsetButtonAvailable() {
      return !!pushToTalkBtn && !pushToTalkBtn.disabled;
    }

    function headsetKeyDown(ev) {
      if (!headsetButtonAvailable()) return;
      if (!isHeadsetButtonEvent(ev)) return;
      if (ev.repeat) {
        ev.preventDefault();
        return;
      }
      ev.preventDefault();
      headsetPressActive = true;
      startPushToTalk();
    }

    function headsetKeyUp(ev) {
      if (!headsetPressActive) return;
      if (!isHeadsetButtonEvent(ev)) return;
      headsetPressActive = false;
      ev.preventDefault();
      stopPushToTalk();
    }

    document.addEventListener('keydown', headsetKeyDown, { passive: false });
    document.addEventListener('keyup', headsetKeyUp, { passive: false });

    window.addEventListener('blur', () => {
      if (!headsetPressActive) return;
      headsetPressActive = false;
      stopPushToTalk();
    });

    function applyLocalTrackState() {
      if (!localStream) return;
      const tracks = localStream.getAudioTracks();
      for (const track of tracks) {
        track.enabled = !micMuted || pushToTalkActive;
      }
    }

    function setMicMuted(muted) {
      micMuted = !!muted;
      applyLocalTrackState();
      muteBtn.textContent = micMuted ? 'Unmute Mic' : 'Mute Mic';
      updateMicStatus();
    }

    function updateMicStatus() {
      if (!micStatusEl) return;
      micStatusEl.classList.remove('live', 'muted', 'offline', 'ptt');
      if (!localStream) {
        micStatusEl.textContent = 'Disconnected';
        micStatusEl.classList.add('offline');
        return;
      }
      if (micMuted && pushToTalkActive) {
        micStatusEl.textContent = 'Push-to-talk (live)';
        micStatusEl.classList.add('ptt');
      } else if (micMuted) {
        micStatusEl.textContent = 'Muted';
        micStatusEl.classList.add('muted');
      } else {
        micStatusEl.textContent = 'Live';
        micStatusEl.classList.add('live');
      }
    }

    function enableMicControls(enabled) {
      muteBtn.disabled = !enabled;
      pushToTalkBtn.disabled = !enabled;
      if (!enabled && headsetPressActive) {
        headsetPressActive = false;
        stopPushToTalk();
      }
    }

    async function joinRoom(room) {
      if (socket) {
        alert('Already connected. Leave first.');
        return;
      }
      if (joiningRoom) {
        alert('Connection in progress. Please wait.');
        return;
      }

      const rawName = (nameInput?.value || '').trim();
      if (!rawName) {
        alert('Please enter your name before joining a room.');
        nameInput?.focus();
        return;
      }
      const normalizedName = rawName.replace(/\s+/g, ' ');
      displayName = normalizedName.slice(0, 60);
      nameInput.value = displayName;
      localNameEl.textContent = displayName;
      joiningRoom = true;
      setRoomButtonsDisabled(true);
      log('Connecting to room ' + room);

      try {
        const DeviceClass = await loadDeviceModule();
        Device = DeviceClass;
      } catch (err) {
        console.error('Failed to load mediasoup-client:', err);
        alert('Failed to load mediasoup client. Check console for details.');
        joiningRoom = false;
        setRoomButtonsDisabled(false);
        return;
      }

      isAdmin = !!adminToggle.checked;
      adminToggle.disabled = true;
      nameInput.disabled = true;

      const query = { room, name: displayName };
      if (isAdmin) query.admin = '1';
      socket = io({ query });

      disconnectHandler = () => {
        cleanup(false);
      };
      socket.on('disconnect', disconnectHandler);

      socket.on('connect_error', () => { log('connect_error'); });
      socket.on('error', (msg) => { alert('Server error: ' + msg); });
      socket.on('kicked', ({ by, byName }) => {
        const kicker = byName || peersInfo.get(by)?.name || 'an admin';
        alert(`You were removed by ${kicker}.`);
        cleanup(true);
      });

      socket.on('peers', (list) => {
        for (const peer of list || []) {
          peersInfo.set(peer.id, { admin: !!peer.admin, name: peer.name || '' });
          ensurePeerCard(peer.id);
        }
        refreshPeerCards();
      });

      socket.on('peer-joined', ({ id, admin, name }) => {
        peersInfo.set(id, { admin: !!admin, name: name || '' });
        ensurePeerCard(id);
        const label = name ? `${name} (${id})` : id;
        log('peer-joined: ' + label);
        refreshPeerCards();
      });

      socket.on('peer-left', ({ id, name }) => {
        peersInfo.delete(id);
        removePeerCard(id);
        const label = name ? `${name} (${id})` : id;
        log('peer-left: ' + label);
        refreshPeerCards();
      });

      socket.on('new-producer', ({ producerId, socketId }) => {
        consumeProducer(producerId, room, socketId).catch(console.error);
      });

      socket.on('producer-closed', ({ producerId }) => {
        removeRemote(producerId);
      });

      socket.emit('joinRoom', { roomId: room }, () => {});

      const routerRtpCapabilities = await new Promise((resolve) => {
        socket.emit('getRtpCapabilities', (cap) => resolve(cap));
      });

      device = new Device();
      await device.load({ routerRtpCapabilities });

      try {
        const mediaConstraints = {
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        };
        localStream = await navigator.mediaDevices.getUserMedia(mediaConstraints);
        setMicMuted(false);
        enableMicControls(true);
      } catch (err) {
        alert('Microphone required');
        cleanup(true);
        return;
      }

      const sendParams = await new Promise((resolve) => {
        socket.emit('createTransport', { roomId: room }, (p) => resolve(p));
      });
      if (sendParams?.error) {
        alert('Transport error: ' + sendParams.error);
        cleanup(true);
        return;
      }
      sendTransport = device.createSendTransport(sendParams);
      sendTransport.on('connect', ({ dtlsParameters }, cb, errCb) => {
        socket.emit('connectTransport', { roomId: room, transportId: sendTransport.id, dtlsParameters }, (res) => {
          if (res && res.error) return errCb(res.error);
          cb();
        });
      });
      sendTransport.on('produce', ({ kind, rtpParameters }, cb, errCb) => {
        socket.emit('produce', { roomId: room, transportId: sendTransport.id, kind, rtpParameters }, (res) => {
          if (res && res.error) return errCb(res.error);
          producedIds.push(res.id);
          cb({ id: res.id });
        });
      });

      for (const track of localStream.getAudioTracks()) {
        try {
          const codecOptions = {
            opusStereo: true,
            opusDtx: true,
          };
          await sendTransport.produce({ track, codecOptions });
        } catch (e) {
          console.warn('produce error', e);
        }
      }
      applyLocalTrackState();

      const recvParams = await new Promise((resolve) => {
        socket.emit('createTransport', { roomId: room }, (p) => resolve(p));
      });
      if (recvParams?.error) {
        alert('Transport error: ' + recvParams.error);
        cleanup(true);
        return;
      }
      recvTransport = device.createRecvTransport(recvParams);
      recvTransport.on('connect', ({ dtlsParameters }, cb, errCb) => {
        socket.emit('connectTransport', { roomId: room, transportId: recvTransport.id, dtlsParameters }, (res) => {
          if (res && res.error) return errCb(res.error);
          cb();
        });
      });

      const existing = await new Promise((resolve) => {
        socket.emit('getProducers', { roomId: room }, (list) => resolve(list || []));
      });
      for (const p of existing) {
        consumeProducer(p.producerId, room, p.socketId).catch(console.error);
      }

      leaveBtn.disabled = false;
      localNameEl.textContent = displayName ? `${displayName} · connected` : 'Connected';
      joiningRoom = false;
      log('Joined ' + room);
      refreshPeerCards();
      updateMicStatus();
    }

    async function consumeProducer(producerId, room, ownerId) {
      if (!recvTransport || !device || !socket) return;
      if (consuming[producerId]) return;

      const data = await new Promise((resolve) => {
        socket.emit('consume', { roomId: room, producerId, rtpCapabilities: device.rtpCapabilities, transportId: recvTransport.id }, (res) => resolve(res));
      });
      if (!data || data.error) {
        console.warn('consume error', data?.error);
        return;
      }

      const consumer = await recvTransport.consume({
        id: data.id,
        producerId: data.producerId,
        kind: data.kind,
        rtpParameters: data.rtpParameters,
      });

      consuming[producerId] = consumer;
      if (ownerId) producerToPeer.set(producerId, ownerId);

      const stream = new MediaStream();
      stream.addTrack(consumer.track);

      let record = null;
      if (ownerId) {
        record = ensurePeerCard(ownerId);
      }
      if (!record && producerToPeer.has(producerId)) {
        record = peerCards.get(producerToPeer.get(producerId));
      }
      if (record) {
        record.audio.srcObject = stream;
        record.stream = stream;
        if (record.muted && !record.pushHeld) {
          record.audio.muted = true;
        } else {
          record.audio.muted = false;
        }
        record.audio.play().catch(() => {});
      }

      consumer.on('producerclose', () => {
        removeRemote(producerId);
      });
      consumer.on('transportclose', () => {
        removeRemote(producerId);
      });
    }

    function removeRemote(producerId) {
      const consumer = consuming[producerId];
      if (consumer) {
        try { consumer.close(); } catch (e) {}
        delete consuming[producerId];
      }
      const peerId = producerToPeer.get(producerId);
      if (peerId) {
        producerToPeer.delete(producerId);
        const record = peerCards.get(peerId);
        if (record) {
          if (record.stream) {
            try { record.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
            record.stream = null;
          }
          if (record.audio) {
            record.audio.srcObject = null;
          }
        }
      }
    }

    function createPeerCard(peerId) {
      const card = document.createElement('div');
      card.className = 'peer-card';
      card.dataset.peerId = peerId;
      card.setAttribute('role', 'listitem');

      const header = document.createElement('div');
      header.className = 'header';

      const nameBlock = document.createElement('div');
      nameBlock.className = 'name-block';

      const name = document.createElement('span');
      name.className = 'peer-name';
      name.textContent = peerId;

      const idMeta = document.createElement('span');
      idMeta.className = 'peer-id';
      idMeta.textContent = summarizeId(peerId);

      nameBlock.appendChild(name);
      nameBlock.appendChild(idMeta);

      const badge = document.createElement('span');
      badge.className = 'admin-badge';

      header.appendChild(nameBlock);
      header.appendChild(badge);
      card.appendChild(header);

      const audio = document.createElement('audio');
      audio.autoplay = true;
      audio.controls = false;
      audio.playsInline = true;
      card.appendChild(audio);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const muteButton = document.createElement('button');
      muteButton.textContent = 'Mute';
      actions.appendChild(muteButton);

      const pushButton = document.createElement('button');
      pushButton.textContent = 'Push to Talk';
      actions.appendChild(pushButton);

      card.appendChild(actions);

      const record = {
        peerId,
        card,
        nameEl: name,
        idEl: idMeta,
        adminBadge: badge,
        audio,
        actions,
        muteButton,
        pushButton,
        kickBtn: null,
        muted: false,
        pushHeld: false,
        stream: null,
        setMuted: null,
      };

      function setMuted(state) {
        record.muted = state;
        if (!record.pushHeld) {
          audio.muted = state;
        }
        muteButton.textContent = state ? 'Unmute' : 'Mute';
      }

      function pushStart(ev) {
        if (ev) ev.preventDefault();
        record.pushHeld = true;
        audio.muted = false;
      }

      function pushEnd() {
        record.pushHeld = false;
        if (record.muted) {
          audio.muted = true;
        }
      }

      muteButton.addEventListener('click', () => {
        setMuted(!record.muted);
      });

      pushButton.addEventListener('mousedown', pushStart);
      pushButton.addEventListener('mouseup', pushEnd);
      pushButton.addEventListener('mouseleave', pushEnd);
      pushButton.addEventListener('touchstart', (ev) => {
        pushStart(ev);
      }, { passive: false });
      pushButton.addEventListener('touchend', () => pushEnd());
      pushButton.addEventListener('touchcancel', () => pushEnd());

      record.setMuted = setMuted;

      return record;
    }

    function ensurePeerCard(peerId) {
      if (!peerId || peerId === socket?.id) return null;
      let record = peerCards.get(peerId);
      if (!record) {
        record = createPeerCard(peerId);
        peerCards.set(peerId, record);
        remoteList.appendChild(record.card);
      }
      const meta = peersInfo.get(peerId);
      const display = peerDisplayName(peerId, meta?.name);
      if (record.nameEl) {
        record.nameEl.textContent = display;
        record.nameEl.title = display;
      }
      if (record.idEl) {
        record.idEl.textContent = summarizeId(peerId);
      }
      record.card.dataset.peerName = display;
      record.card.setAttribute('aria-label', display);
      record.adminBadge.textContent = meta?.admin ? 'admin' : '';
      updateKickButton(record);
      return record;
    }

    function updateKickButton(record) {
      if (!record) return;
      if (!isAdmin) {
        if (record.kickBtn) {
          record.kickBtn.remove();
          record.kickBtn = null;
        }
        return;
      }
      if (record.kickBtn) return;
      const btn = document.createElement('button');
      btn.textContent = 'Kick';
      btn.classList.add('kick');
      btn.addEventListener('click', () => {
        if (!socket) return;
        socket.emit('kick', { targetId: record.peerId });
      });
      record.actions.appendChild(btn);
      record.kickBtn = btn;
    }

    function refreshPeerCards() {
      for (const record of peerCards.values()) {
        const meta = peersInfo.get(record.peerId);
        const display = peerDisplayName(record.peerId, meta?.name);
        if (record.nameEl) {
          record.nameEl.textContent = display;
          record.nameEl.title = display;
        }
        if (record.idEl) {
          record.idEl.textContent = summarizeId(record.peerId);
        }
        record.card.dataset.peerName = display;
        record.card.setAttribute('aria-label', display);
        record.adminBadge.textContent = meta?.admin ? 'admin' : '';
        if (record.muted && !record.pushHeld) {
          record.audio.muted = true;
        }
        if (!record.muted) {
          record.audio.muted = false;
        }
        if (isAdmin) {
          updateKickButton(record);
        } else if (record.kickBtn) {
          record.kickBtn.remove();
          record.kickBtn = null;
        }
      }
    }

    function removePeerCard(peerId) {
      const record = peerCards.get(peerId);
      if (!record) return;
      if (record.stream) {
        try { record.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
      }
      if (record.audio) {
        record.audio.srcObject = null;
      }
      if (record.card.parentElement) {
        record.card.parentElement.removeChild(record.card);
      }
      peerCards.delete(peerId);

      for (const [producerId, ownerId] of Array.from(producerToPeer.entries())) {
        if (ownerId === peerId) {
          producerToPeer.delete(producerId);
          const consumer = consuming[producerId];
          if (consumer) {
            try { consumer.close(); } catch (e) {}
            delete consuming[producerId];
          }
        }
      }
    }

    function cleanup(forceDisconnect = false) {
      const currentSocket = socket;
      if (currentSocket) {
        if (disconnectHandler) {
          currentSocket.off('disconnect', disconnectHandler);
        }
        if (forceDisconnect) {
          try { currentSocket.disconnect(); } catch (e) {}
        }
      }
      socket = null;
      disconnectHandler = null;

      if (sendTransport) {
        try { sendTransport.close(); } catch (e) {}
      }
      if (recvTransport) {
        try { recvTransport.close(); } catch (e) {}
      }
      sendTransport = null;
      recvTransport = null;

      for (const consumer of Object.values(consuming)) {
        try { consumer.close(); } catch (e) {}
      }
      for (const key of Object.keys(consuming)) {
        delete consuming[key];
      }

      for (const record of peerCards.values()) {
        if (record.stream) {
          try { record.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
        }
        if (record.audio) {
          record.audio.srcObject = null;
        }
        record.card.remove();
      }
      peerCards.clear();
      peersInfo.clear();
      producerToPeer.clear();
      remoteList.innerHTML = '';

      if (localStream) {
        for (const track of localStream.getTracks()) {
          try { track.stop(); } catch (e) {}
        }
        localStream = null;
      }

      producedIds = [];
      micMuted = false;
      pushToTalkActive = false;
      isAdmin = false;
      joiningRoom = false;
      enableMicControls(false);
      muteBtn.textContent = 'Mute Mic';
      updateMicStatus();

      device = null;

      leaveBtn.disabled = true;
      adminToggle.disabled = false;
      nameInput.disabled = false;
      localNameEl.textContent = displayName
        ? `${displayName} · not connected`
        : 'Name not set';
      setRoomButtonsDisabled(false);

      log('Left');
    }
  </script>
</body>
</html>
