<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Present on the login page too, so installing from here still yields the
       correct icon and a standalone window rather than a browser tab. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#4059ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Intercom" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <title>Church Intercom — Sign in</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --border: rgba(15, 23, 42, 0.12);
      --border-strong: rgba(15, 23, 42, 0.2);
      --text: #0f172a;
      --muted: rgba(15, 23, 42, 0.6);
      --primary: #4059ff;
      --primary-dark: #2433b8;
      --primary-soft: rgba(64, 89, 255, 0.1);
      --danger: #c2410c;
      --success: #16a34a;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #f3f4ff 0%, #eef2ff 35%, #f8fafc 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
    }

    .auth-container {
      width: min(450px, 100%);
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px clamp(24px, 5vw, 40px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 3vw, 2rem);
      letter-spacing: -0.02em;
    }

    .auth-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      padding: 4px;
      background: rgba(15, 23, 42, 0.05);
      border-radius: 12px;
    }

    .tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .tab.active {
      background: white;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .field-group {
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: var(--surface-strong);
    }

    input:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
      margin-top: 8px;
    }

    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(64, 89, 255, 0.24);
      background: var(--primary-dark);
    }

    button[type="submit"]:disabled {
      cursor: not-allowed;
      background: rgba(15, 23, 42, 0.15);
      color: rgba(15, 23, 42, 0.45);
      box-shadow: none;
    }

    .error-message {
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      color: #991b1b;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    .success-message {
      padding: 12px 16px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 12px;
      color: #166534;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }

    .success-message.visible {
      display: block;
    }

    .help-text {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
      margin: 1px 0 0;
      flex-shrink: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-hint {
      display: block;
      margin-top: 2px;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--muted);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: rgba(15, 23, 42, 0.8);
        --surface-strong: rgba(15, 23, 42, 0.9);
        --border: rgba(148, 163, 184, 0.25);
        --border-strong: rgba(148, 163, 184, 0.45);
        --text: #e2e8f0;
        --muted: rgba(226, 232, 240, 0.7);
      }

      body {
        background: radial-gradient(circle at top, rgba(30, 64, 175, 0.35), rgba(15, 23, 42, 0.95));
      }

      .tab.active {
        background: rgba(226, 232, 240, 0.1);
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>Church Intercom</h1>
      <p>Sign in to continue</p>
    </div>

    <div id="loginSection" class="form-section active">
      <div id="loginError" class="error-message"></div>

      <form id="loginForm">
        <div class="field-group">
          <label class="field-label" for="loginUsername">Username</label>
          <input
            type="text"
            id="loginUsername"
            name="usernameOrEmail"
            required
            autofocus
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="Enter your username"
          />
        </div>

        <div class="field-group">
          <label class="checkbox-row" for="loginAsAdmin">
            <input type="checkbox" id="loginAsAdmin" name="asAdmin" />
            <span>
              Sign in as administrator
              <span class="checkbox-hint">
                Adds the kick, talk-to-the-building and sound-card controls.
              </span>
            </span>
          </label>
        </div>

        <button type="submit" id="loginBtn">Login</button>
      </form>

      <p class="help-text" style="margin-top: 18px; text-align: center;">
        There's no password — your username is enough. Use the name your
        production lead gave you, so everyone knows who is speaking.
      </p>
    </div>
  </div>

  <script type="module">
    // Self-registration was removed: an intercom is not a public service, so
    // accounts are created by an administrator. This page only signs in, and
    // sign-in is passwordless — see PASSWORDLESS_SENTINEL in auth.js.
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    const username = document.getElementById('loginUsername');
    const asAdmin = document.getElementById('loginAsAdmin');

    function showError(message) {
      loginError.textContent = message;
      loginError.classList.add('visible');
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginError.classList.remove('visible');

      // Built by hand rather than from FormData: an unchecked box is simply
      // absent from a form submission, and the server reads asAdmin as a
      // boolean rather than as "on" or missing.
      const data = {
        usernameOrEmail: username.value.trim(),
        asAdmin: asAdmin.checked,
      };

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'include',
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || 'Sign in failed');
        }

        window.location.href = '/';
      } catch (error) {
        showError(error.message);
        // Left in place rather than cleared: the username is the only thing on
        // this form, and a typo is easier to fix than to retype on a phone.
        username.focus();
        username.select();
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
